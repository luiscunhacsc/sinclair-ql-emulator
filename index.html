<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sinclair QL Emulator</title>
    <link rel="stylesheet" href="./src/ui/app.css">
  </head>
  <body>
    <main>
      <header>
        <span class="eyebrow">SINCLAIR</span>
        <h1>QL Emulator</h1>
        <p>Base técnica do emulador do Sinclair QL Issue 6.</p>
      </header>

      <section class="screen-panel" aria-label="Ecrã do Sinclair QL">
        <canvas width="512" height="256"></canvas>
        <div class="screen-message">A aguardar uma ROM de 48 KiB</div>
      </section>

      <section class="controls">
        <label class="file-control">
          <span>Selecionar ROM</span>
          <input id="rom-file" type="file" accept=".rom,.bin,application/octet-stream">
        </label>
        <button id="run" type="button" disabled>Ler vetores de arranque</button>
      </section>

      <p id="status" role="status" aria-live="polite">
        A ROM é processada apenas neste navegador e não é enviada para qualquer servidor.
      </p>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
