<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sinclair QL Emulator</title>
    <link rel="stylesheet" href="./src/ui/app.css">
  </head>
  <body>
    <main>
      <header>
        <span class="eyebrow">SINCLAIR</span>
        <h1>QL Emulator</h1>
        <p>Base técnica do emulador do Sinclair QL Issue 6.</p>
      </header>

      <section class="presentation" aria-labelledby="presentation-label">
        <div class="presentation-toolbar">
          <span id="presentation-label" class="presentation-label">Apresentação</span>
          <div class="presentation-switch" role="radiogroup" aria-labelledby="presentation-label">
            <button
              type="button"
              role="radio"
              aria-checked="false"
              tabindex="-1"
              data-presentation-option="screen"
            >Ecrã</button>
            <button
              type="button"
              role="radio"
              aria-checked="true"
              data-presentation-option="monitor"
            >Monitor</button>
            <button
              type="button"
              role="radio"
              aria-checked="false"
              tabindex="-1"
              data-presentation-option="computer"
            >QL completo</button>
          </div>
          <button
            id="fullscreen"
            class="fullscreen-button"
            type="button"
            aria-pressed="false"
            aria-label="Mostrar a apresentação em ecrã inteiro"
          >
            Ecrã inteiro
          </button>
        </div>

        <div class="computer-stage" data-presentation="monitor" aria-label="Sinclair QL com monitor">
          <div class="stage-surface">
            <img
              class="presentation-art monitor-frame"
              src="./assets/monitor/ql-monitor-frame.png"
              alt=""
              aria-hidden="true"
            >
            <img
              class="presentation-art full-system-frame"
              src="./assets/compositions/qlwithmonitor.png"
              alt=""
              aria-hidden="true"
            >

            <div class="screen-panel">
              <canvas
                id="screen"
                width="512"
                height="256"
                tabindex="0"
                aria-label="Ecrã do Sinclair QL; clique para usar o teclado"
              ></canvas>
              <div id="screen-message" class="screen-message">A carregar a Minerva…</div>
            </div>
          </div>
        </div>

      </section>

      <section class="controls">
        <button id="run" type="button" disabled>Executar</button>
        <button id="step" type="button" disabled>Passo</button>
        <button id="reset" type="button" disabled>Reiniciar</button>
        <label class="file-control">
          <span>Outra ROM</span>
          <input id="rom-file" type="file" accept=".rom,.bin,application/octet-stream">
        </label>
      </section>

      <p id="status" role="status" aria-live="polite">
        A iniciar a Minerva 1.98a1 incluída no projeto…
      </p>
      <p class="keyboard-hint">
        Clique no ecrã para usar o teclado. Backspace (Ctrl+← no QL) apaga à esquerda;
        Ctrl+→ apaga sob o cursor.
      </p>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
