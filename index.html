<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sinclair QL Emulator</title>
    <link rel="stylesheet" href="./src/ui/app.css">
  </head>
  <body>
    <main>
      <header>
        <span class="eyebrow">SINCLAIR</span>
        <h1>QL Emulator</h1>
        <p>Base técnica do emulador do Sinclair QL Issue 6.</p>
      </header>

      <section class="monitor" aria-label="Monitor do Sinclair QL">
        <div class="screen-panel">
          <canvas id="screen" width="512" height="256"></canvas>
          <div id="screen-message" class="screen-message">A carregar a Minerva…</div>
        </div>
      </section>

      <section class="controls">
        <button id="run" type="button" disabled>Executar</button>
        <button id="step" type="button" disabled>Passo</button>
        <button id="reset" type="button" disabled>Reiniciar</button>
        <label class="file-control">
          <span>Outra ROM</span>
          <input id="rom-file" type="file" accept=".rom,.bin,application/octet-stream">
        </label>
      </section>

      <p id="status" role="status" aria-live="polite">
        A iniciar a Minerva 1.98a1 incluída no projeto…
      </p>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
